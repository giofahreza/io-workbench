<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clear Cache - io-workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=20260812-06" />
  </head>
  <body class="standalone-page">
    <main class="standalone-panel">
      <h1>Clear Cache</h1>
      <p id="cache-status">Ready to clear local web caches for io-workbench.</p>
      <div class="button-row">
        <button id="clear-cache" type="button">Clear Cache</button>
        <a class="button-link" href="/">Open App</a>
      </div>
    </main>
    <script>
      document.querySelector("#clear-cache").addEventListener("click", async () => {
        const status = document.querySelector("#cache-status");
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
        const registrations = await navigator.serviceWorker?.getRegistrations?.() || [];
        await Promise.all(registrations.map((registration) => registration.unregister()));
        localStorage.removeItem("iowb.webPreferences");
        status.textContent = "Cache cleared. Reload the app to fetch fresh assets.";
      });
    </script>
  </body>
</html>
