name: Release io-workbench

on:
  push:
    tags:
      - "v*"

concurrency:
  group: io-workbench-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and required submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          # For private sibling submodules, provide a fine-grained PAT with
          # Contents: Read as IOWB_SUBMODULES_TOKEN.
          token: ${{ secrets.IOWB_SUBMODULES_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verify-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            verify-cargo-

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Check generated documentation and release installers
        run: |
          set -euo pipefail
          node --check scripts/generate-docs.mjs
          node --check scripts/serve-landing.mjs
          node scripts/generate-docs.mjs --check
          sh -n scripts/install.sh

  package-native:
    name: Package ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners produce binaries that match their advertised CPU and
          # platform. ARM runner labels require GitHub-hosted ARM availability.
          - platform: linux-x86_64
            # Pin an older glibc baseline so the dynamically linked x86_64
            # package remains usable on a wider range of Linux hosts.
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            asset_suffix: linux-x86_64.tar.gz
            macosx_deployment_target: ""
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            asset_suffix: linux-aarch64.tar.gz
            macosx_deployment_target: ""
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            asset_suffix: macos-x86_64.tar.gz
            macosx_deployment_target: "10.13"
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            asset_suffix: macos-aarch64.tar.gz
            macosx_deployment_target: "11.0"
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
            asset_suffix: windows-x86_64.zip
            macosx_deployment_target: ""
          - platform: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
            asset_suffix: windows-aarch64.zip
            macosx_deployment_target: ""

    steps:
      - name: Checkout source and required submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ secrets.IOWB_SUBMODULES_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-

      - name: Build and package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] \
            || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          cargo build --release --locked -p iowb-cli \
            --bin io-workbench --bin iowb --target "$TARGET"

          stage_dir="$(mktemp -d)"
          trap 'rm -rf "$stage_dir"' EXIT
          install -m 0755 "target/$TARGET/release/io-workbench" "$stage_dir/io-workbench"
          install -m 0755 "target/$TARGET/release/iowb" "$stage_dir/iowb"
          install -m 0644 README.md "$stage_dir/README.md"
          mkdir -p dist
          tar -C "$stage_dir" -czf "dist/io-workbench-$TAG-$ASSET_SUFFIX" \
            io-workbench iowb README.md

      - name: Build and package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v[0-9][A-Za-z0-9._-]*$') {
            throw "Invalid release tag: $env:TAG"
          }
          cargo build --release --locked -p iowb-cli --bin io-workbench --bin iowb --target "$env:TARGET"

          $stageDir = Join-Path $env:RUNNER_TEMP 'io-workbench-release-stage'
          Remove-Item -LiteralPath $stageDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          $buildDir = Join-Path (Join-Path 'target' $env:TARGET) 'release'
          Copy-Item -LiteralPath (Join-Path $buildDir 'io-workbench.exe') -Destination (Join-Path $stageDir 'io-workbench.exe')
          Copy-Item -LiteralPath (Join-Path $buildDir 'iowb.exe') -Destination (Join-Path $stageDir 'iowb.exe')
          Copy-Item -LiteralPath 'README.md' -Destination (Join-Path $stageDir 'README.md')
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $archive = "dist/io-workbench-$env:TAG-$env:ASSET_SUFFIX"
          Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $archive -Force

      - name: Upload packaged native asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/io-workbench-${{ github.ref_name }}-${{ matrix.asset_suffix }}
          if-no-files-found: error
          overwrite: true

  package-android:
    name: Package Android APKs
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and required submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ secrets.IOWB_SUBMODULES_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          # yes commonly exits with SIGPIPE after sdkmanager accepts the final
          # license. Preserve sdkmanager's status rather than failing on that
          # expected producer exit under pipefail.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager_status="${PIPESTATUS[1]}"
          set -o pipefail
          [ "$sdkmanager_status" -eq 0 ]
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.6.1"

      - name: Validate Android signing secrets
        shell: bash
        env:
          IOWB_ANDROID_KEYSTORE_BASE64: ${{ secrets.IOWB_ANDROID_KEYSTORE_BASE64 }}
          IOWB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.IOWB_ANDROID_KEYSTORE_PASSWORD }}
          IOWB_ANDROID_KEY_ALIAS: ${{ secrets.IOWB_ANDROID_KEY_ALIAS }}
          IOWB_ANDROID_KEY_PASSWORD: ${{ secrets.IOWB_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=false
          for name in \
            IOWB_ANDROID_KEYSTORE_BASE64 \
            IOWB_ANDROID_KEYSTORE_PASSWORD \
            IOWB_ANDROID_KEY_ALIAS \
            IOWB_ANDROID_KEY_PASSWORD
          do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            else
              echo "::error title=Missing Android signing secret::$name is required to publish signed APKs."
              missing=true
            fi
          done
          [ "$missing" = false ]

      - name: Build signed ABI APKs
        shell: bash
        env:
          IOWB_ANDROID_KEYSTORE_BASE64: ${{ secrets.IOWB_ANDROID_KEYSTORE_BASE64 }}
          IOWB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.IOWB_ANDROID_KEYSTORE_PASSWORD }}
          IOWB_ANDROID_KEY_ALIAS: ${{ secrets.IOWB_ANDROID_KEY_ALIAS }}
          IOWB_ANDROID_KEY_PASSWORD: ${{ secrets.IOWB_ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] \
            || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          key_store="$RUNNER_TEMP/io-workbench-release.jks"
          trap 'rm -f "$key_store"' EXIT
          printf '%s' "$IOWB_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          test -s "$key_store"
          export IOWB_ANDROID_KEYSTORE_PATH="$key_store"

          version_name="${TAG#v}"
          # The run number is monotonic within this workflow. Its offset is
          # above the historic source versionCode (41), preserving upgrades.
          version_code="$((100000 + GITHUB_RUN_NUMBER))"
          gradle -p apps/mobile :androidApp:assembleRelease \
            -Piowb.android.enabled=true \
            -Piowb.release.requireSigning=true \
            -Piowb.release.versionCode="$version_code" \
            -Piowb.release.versionName="$version_name" \
            -x lintVitalRelease \
            --console=plain --no-daemon

      - name: Verify, name, and stage Android APKs
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          output_dir="apps/mobile/androidApp/build/outputs/apk/release"
          arm64_apk="$(find "$output_dir" -maxdepth 1 -type f -name '*arm64-v8a*release.apk' ! -name '*unsigned*' -print -quit)"
          x86_64_apk="$(find "$output_dir" -maxdepth 1 -type f -name '*x86_64*release.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$arm64_apk"
          test -n "$x86_64_apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$arm64_apk"
          "$apksigner" verify --verbose --print-certs "$x86_64_apk"
          mkdir -p dist
          install -m 0644 "$arm64_apk" "dist/io-workbench-$TAG-android-arm64-v8a.apk"
          install -m 0644 "$x86_64_apk" "dist/io-workbench-$TAG-android-x86_64.apk"

      - name: Upload packaged Android assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: |
            dist/io-workbench-${{ github.ref_name }}-android-arm64-v8a.apk
            dist/io-workbench-${{ github.ref_name }}-android-x86_64.apk
          if-no-files-found: error
          overwrite: true

  publish-release:
    name: Publish GitHub Release
    needs:
      - package-native
      - package-android
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release installer scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download packaged release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Add installers, latest APK aliases, and checksums
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] \
            || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          test -f scripts/install.sh
          test -f scripts/install.ps1
          chmod 0755 scripts/install.sh
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          for asset in \
            "io-workbench-$TAG-linux-x86_64.tar.gz" \
            "io-workbench-$TAG-linux-aarch64.tar.gz" \
            "io-workbench-$TAG-macos-x86_64.tar.gz" \
            "io-workbench-$TAG-macos-aarch64.tar.gz" \
            "io-workbench-$TAG-windows-x86_64.zip" \
            "io-workbench-$TAG-windows-aarch64.zip" \
            "io-workbench-$TAG-android-arm64-v8a.apk" \
            "io-workbench-$TAG-android-x86_64.apk"
          do
            test -f "release-assets/$asset"
          done
          cp "release-assets/io-workbench-$TAG-android-arm64-v8a.apk" \
            release-assets/io-workbench-android-arm64-v8a.apk
          cp "release-assets/io-workbench-$TAG-android-x86_64.apk" \
            release-assets/io-workbench-android-x86_64.apk
          (
            cd release-assets
            sha256sum \
              "io-workbench-$TAG-linux-x86_64.tar.gz" \
              "io-workbench-$TAG-linux-aarch64.tar.gz" \
              "io-workbench-$TAG-macos-x86_64.tar.gz" \
              "io-workbench-$TAG-macos-aarch64.tar.gz" \
              "io-workbench-$TAG-windows-x86_64.zip" \
              "io-workbench-$TAG-windows-aarch64.zip" \
              "io-workbench-$TAG-android-arm64-v8a.apk" \
              "io-workbench-$TAG-android-x86_64.apk" \
              io-workbench-android-arm64-v8a.apk \
              io-workbench-android-x86_64.apk \
              install.sh \
              install.ps1 > SHA256SUMS
          )

      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/*

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --generate-notes --title "$TAG"
          fi

  deploy-production:
    name: Deploy workbench.giofahreza.com
    needs: publish-release
    # The deployment runner is installed on the private production host. This
    # avoids exposing SSH directly to the public internet while retaining the
    # workflow's explicit SSH, checksum, rollback, and health-check boundary.
    runs-on: [self-hosted, linux, x64, io-workbench-deploy]
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_REMOTE_STAGE_DIR: ${{ secrets.DEPLOY_REMOTE_STAGE_DIR }}
      DEPLOY_LIVE_BINARY: ${{ secrets.DEPLOY_LIVE_BINARY }}
      DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
      DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
      DEPLOY_PUBLIC_HEALTH_URL: ${{ secrets.DEPLOY_PUBLIC_HEALTH_URL }}
    steps:
      - name: Download the Linux production archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux-x86_64
          path: release

      - name: Prepare production binary and validate deployment secrets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          missing=false
          for name in \
            DEPLOY_HOST \
            DEPLOY_USER \
            DEPLOY_SSH_KEY \
            DEPLOY_SSH_KNOWN_HOSTS \
            DEPLOY_REMOTE_STAGE_DIR \
            DEPLOY_LIVE_BINARY \
            DEPLOY_SERVICE_NAME \
            DEPLOY_HEALTH_URL
          do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            else
              echo "::error title=Missing deployment secret::$name is required for a tag deployment."
              missing=true
            fi
          done
          [ "$missing" = false ]
          if [ -z "$DEPLOY_SSH_PORT" ]; then
            DEPLOY_SSH_PORT=22
          fi
          case "$DEPLOY_SSH_PORT" in
            *[!0-9]*|'') echo "DEPLOY_SSH_PORT must be numeric." >&2; exit 1 ;;
          esac
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] \
            || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          archive="release/io-workbench-$TAG-linux-x86_64.tar.gz"
          test -f "$archive"
          mkdir -p release/package
          tar -xzf "$archive" -C release/package
          test -x release/package/io-workbench
          expected_sha256="$(sha256sum release/package/io-workbench | awk '{print $1}')"
          test -n "$expected_sha256"
          short_sha="${GITHUB_SHA::12}"
          staged_binary="$DEPLOY_REMOTE_STAGE_DIR/io-workbench.$short_sha"
          printf '%s\n' "DEPLOY_SSH_PORT=$DEPLOY_SSH_PORT" >> "$GITHUB_ENV"
          printf '%s\n' "STAGED_BINARY=$staged_binary" >> "$GITHUB_ENV"
          printf '%s\n' "EXPECTED_SHA256=$expected_sha256" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          deploy_ssh_dir="$RUNNER_TEMP/io-workbench-deploy-ssh"
          mkdir -p "$deploy_ssh_dir"
          chmod 700 "$deploy_ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$deploy_ssh_dir/deploy_key"
          chmod 600 "$deploy_ssh_dir/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$deploy_ssh_dir/known_hosts"
          chmod 644 "$deploy_ssh_dir/known_hosts"
          printf '%s\n' "DEPLOY_SSH_DIR=$deploy_ssh_dir" >> "$GITHUB_ENV"

      - name: Create remote staging directory
        shell: bash
        run: |
          set -euo pipefail
          stage_dir_b64="$(printf '%s' "$DEPLOY_REMOTE_STAGE_DIR" | base64 -w0)"
          ssh -i "$DEPLOY_SSH_DIR/deploy_key" -p "$DEPLOY_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$DEPLOY_SSH_DIR/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_STAGE_DIR_B64=$stage_dir_b64 bash -s" <<'REMOTE'
          set -euo pipefail
          stage_dir="$(printf '%s' "$DEPLOY_STAGE_DIR_B64" | base64 --decode)"
          mkdir -p "$stage_dir"
          REMOTE

      - name: Upload verified production binary
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$DEPLOY_SSH_DIR/deploy_key" -P "$DEPLOY_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$DEPLOY_SSH_DIR/known_hosts" \
            release/package/io-workbench \
            "$DEPLOY_USER@$DEPLOY_HOST:$STAGED_BINARY"

      - name: Install, restart, and verify locally
        shell: bash
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          deploy_commit_b64="$(printf '%s' "$DEPLOY_COMMIT" | base64 -w0)"
          deploy_ref_b64="$(printf '%s' "$DEPLOY_REF" | base64 -w0)"
          staged_binary_b64="$(printf '%s' "$STAGED_BINARY" | base64 -w0)"
          live_binary_b64="$(printf '%s' "$DEPLOY_LIVE_BINARY" | base64 -w0)"
          service_name_b64="$(printf '%s' "$DEPLOY_SERVICE_NAME" | base64 -w0)"
          health_url_b64="$(printf '%s' "$DEPLOY_HEALTH_URL" | base64 -w0)"
          expected_sha256_b64="$(printf '%s' "$EXPECTED_SHA256" | base64 -w0)"
          ssh -i "$DEPLOY_SSH_DIR/deploy_key" -p "$DEPLOY_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$DEPLOY_SSH_DIR/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_COMMIT_B64=$deploy_commit_b64 DEPLOY_REF_B64=$deploy_ref_b64 STAGED_BINARY_B64=$staged_binary_b64 LIVE_BINARY_B64=$live_binary_b64 SERVICE_NAME_B64=$service_name_b64 HEALTH_URL_B64=$health_url_b64 EXPECTED_SHA256_B64=$expected_sha256_b64 bash -s" <<'REMOTE'
          set -euo pipefail
          decode() {
            printf '%s' "$1" | base64 --decode
          }
          deploy_commit="$(decode "$DEPLOY_COMMIT_B64")"
          deploy_ref="$(decode "$DEPLOY_REF_B64")"
          staged_binary="$(decode "$STAGED_BINARY_B64")"
          live_binary="$(decode "$LIVE_BINARY_B64")"
          service_name="$(decode "$SERVICE_NAME_B64")"
          health_url="$(decode "$HEALTH_URL_B64")"
          expected_sha256="$(decode "$EXPECTED_SHA256_B64")"
          backup=""
          replacement_started=false
          rollback_on_failure() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$replacement_started" = true ]; then
              echo "Deployment failed; restoring the prior binary when available." >&2
              set +e
              if [ -n "$backup" ] && [ -e "$backup" ]; then
                sudo cp --preserve=mode,timestamps "$backup" "$live_binary"
                sudo systemctl restart "$service_name"
              else
                echo "No prior binary is available for automatic rollback." >&2
              fi
            fi
            exit "$status"
          }
          trap rollback_on_failure EXIT
          test -x "$staged_binary"
          staged_sha256="$(sha256sum "$staged_binary" | awk '{print $1}')"
          [ "$staged_sha256" = "$expected_sha256" ]
          live_directory="$(dirname "$live_binary")"
          sudo install -d -o root -g root -m 0755 "$live_directory"
          backup="$live_binary.bak.$(date +%Y%m%d%H%M%S)"
          if [ -e "$live_binary" ]; then
            sudo cp --preserve=mode,timestamps "$live_binary" "$backup"
          fi
          replacement_started=true
          sudo install -o root -g root -m 0755 "$staged_binary" "$live_binary"
          sudo systemctl restart "$service_name"
          systemctl is-active --quiet "$service_name"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$health_url" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Local health check failed after restart: $health_url" >&2
              exit 1
            fi
            sleep 1
          done
          live_sha256="$(sha256sum "$live_binary" | awk '{print $1}')"
          [ "$live_sha256" = "$expected_sha256" ]
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          revision_path="$live_directory/revision.json"
          printf '{"commit":"%s","ref":"%s","sha256":"%s","deployed_at":"%s"}\n' \
            "$deploy_commit" "$deploy_ref" "$live_sha256" "$deployed_at" \
            | sudo tee "$revision_path" >/dev/null
          rm -f "$staged_binary"
          trap - EXIT
          REMOTE

      - name: Verify workbench.giofahreza.com
        shell: bash
        run: |
          set -euo pipefail
          public_health_url="${DEPLOY_PUBLIC_HEALTH_URL:-https://workbench.giofahreza.com/health}"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$public_health_url" >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Public health check failed: $public_health_url" >&2
              exit 1
            fi
            sleep 2
          done
